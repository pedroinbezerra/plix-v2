services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plix-app
    restart: unless-stopped
    ports:
      - "3200:3200"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no arquivo .env}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-pt-BR}
      TMDB_REGION: ${TMDB_REGION:-BR}
      CATALOG_PROVIDER_BASE_URL: ${CATALOG_PROVIDER_BASE_URL:-https://warezcdn.sbs}
      PLAYBACK_PROVIDER_BASE_URL: ${PLAYBACK_PROVIDER_BASE_URL:-https://warezcdn.sbs}
      AUTH_SECRET: ${AUTH_SECRET:-plix_super_secret_local_dev_key_32_characters_minimum}
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-password123}
      PORT: 3200
      HOST: 0.0.0.0
